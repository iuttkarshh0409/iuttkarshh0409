<rect width="720" height="420" rx="22" fill="url(#b)"/><rect width="720" height="420" rx="22" fill="url(#grid)"/>
<g fill="none" stroke="#c77b9b" stroke-opacity=".65" stroke-width="1.5">
<path d="M95 210L205 125L325 180L445 92L585 155L640 275L500 320L360 265L220 320L95 210"/>
