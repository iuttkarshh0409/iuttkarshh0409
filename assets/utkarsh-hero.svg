<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Utkarsh Dubey — Developer Profile</title>
  <desc id="desc">A dark burgundy technical banner with subtle animated light, orbital geometry, and a glowing underline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="55%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="45%" stop-color="#C77B9B" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#E5B5C7" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#E5B5C7" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#701A3D" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>
  <ellipse cx="980" cy="170" rx="330" ry="260" fill="url(#halo)"/>
  <g fill="none" stroke="#C77B9B" stroke-opacity=".38">
    <circle cx="1000" cy="175" r="105" stroke-dasharray="3 10"/>
    <circle cx="1000" cy="175" r="145" stroke-opacity=".2"/>
    <ellipse cx="1000" cy="175" rx="190" ry="75" transform="rotate(-28 1000 175)" stroke-dasharray="2 8"/>
    <path d="M790 270 Q910 120 1080 220 T1200 145" stroke="#E5B5C7" stroke-opacity=".5"/>
  </g>
  <circle cx="1120" cy="115" r="4" fill="#E5B5C7" filter="url(#glow)"/>
  <circle cx="866" cy="244" r="3" fill="#C77B9B"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="76" y="80" fill="#E5B5C7" font-size="14" letter-spacing="5">SOFTWARE · SYSTEMS · INTELLIGENCE</text>
    <text x="72" y="165" fill="#F8F0F3" font-size="58" font-weight="700" letter-spacing="-1">Utkarsh Dubey</text>
    <text x="76" y="207" fill="#E5B5C7" font-size="20" letter-spacing="1.2">Full-Stack Developer  /  AI Systems Builder</text>
    <path d="M76 244 H460" stroke="#701A3D" stroke-width="3" stroke-linecap="round"/>
    <path d="M76 244 H460" stroke="url(#shine)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0 384;150 234;0 384" dur="5s" repeatCount="indefinite"/>
    </path>
    <text x="76" y="290" fill="#F8F0F3" fill-opacity=".7" font-size="14" letter-spacing="2">BUILD FIRST. REFINE RELENTLESSLY.</text>
  </g>
  <path d="M18 335 H1182" stroke="#C77B9B" stroke-opacity=".28"/>
  <text x="76" y="356" fill="#E5B5C7" fill-opacity=".75" font-family="monospace" font-size="11">ENGINEERING PRACTICAL, EXPLAINABLE SOFTWARE</text>
</svg>
