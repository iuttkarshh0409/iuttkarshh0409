<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Utkarsh Dubey — Engineering the next layer</title>
<desc id="desc">An animated burgundy digital environment with orbital paths, a moving scan line, signal pulses, and a technical grid.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#09060A"/><stop offset=".48" stop-color="#190812"/><stop offset="1" stop-color="#3B0D23"/>
  </linearGradient>
  <radialGradient id="ambient">
    <stop offset="0" stop-color="#8D2450" stop-opacity=".36"/><stop offset="1" stop-color="#10070C" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C77B9B" stop-opacity="0"/><stop offset=".5" stop-color="#F3C5D7" stop-opacity=".9"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="textGlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFF6FA"/><stop offset=".7" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#E5B5C7" stroke-opacity=".075" stroke-width=".8"/>
    <circle cx="0" cy="0" r="1" fill="#E5B5C7" fill-opacity=".16"/>
  </pattern>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="lineGlow" x="-10%" y="-500%" width="120%" height="1100%">
    <feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="panel"><rect width="1200" height="470" rx="22"/></clipPath>
</defs>
<g clip-path="url(#panel)">
  <rect width="1200" height="470" fill="url(#background)"/>
  <rect width="1200" height="470" fill="url(#grid)"/>
  <ellipse cx="925" cy="220" rx="390" ry="330" fill="url(#ambient)">
    <animate attributeName="opacity" values=".65;1;.65" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- distant technical frame -->
  <g fill="none" stroke="#C77B9B" stroke-opacity=".26">
    <path d="M720 38H1148V432H760"/>
    <path d="M742 56H1128V414H780" stroke-dasharray="2 8"/>
    <path d="M850 38V20H868 M1148 90H1170V108 M1020 432V450H1002 M720 350H702V332"/>
  </g>

  <!-- animated orbital geometry -->
  <g transform="translate(940 220)" fill="none">
    <circle r="132" stroke="#E5B5C7" stroke-opacity=".22" stroke-dasharray="2 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="70s" repeatCount="indefinite"/>
    </circle>
    <circle r="98" stroke="#C77B9B" stroke-opacity=".35" stroke-dasharray="45 18 3 18">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="38s" repeatCount="indefinite"/>
    </circle>
    <ellipse rx="180" ry="64" transform="rotate(-32)" stroke="#E5B5C7" stroke-opacity=".34"/>
    <ellipse rx="180" ry="64" transform="rotate(48)" stroke="#C77B9B" stroke-opacity=".28" stroke-dasharray="3 7"/>
    <circle r="49" stroke="#C77B9B" stroke-opacity=".48"/>
    <circle r="14" fill="#701A3D" stroke="#F3C5D7" stroke-opacity=".8" filter="url(#softGlow)">
      <animate attributeName="r" values="12;17;12" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="0" r="5" fill="#F3C5D7" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-90" cy="-62" r="3.5" fill="#C77B9B">
      <animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- faint moving scan line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#beam)" opacity=".55">
    <animate attributeName="y" values="-5;475;-5" dur="11s" repeatCount="indefinite"/>
  </rect>

  <!-- left editorial content -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="76" y="82" fill="#E5B5C7" font-size="13" letter-spacing="5">INDEPENDENTLY BUILT · CONTINUOUSLY REFINED</text>
    <path d="M76 106H300" stroke="#701A3D" stroke-width="2"/>
    <text x="72" y="183" fill="url(#textGlow)" font-size="62" font-weight="700" letter-spacing="-2">Utkarsh Dubey</text>
    <text x="78" y="226" fill="#F8F0F3" font-size="21" letter-spacing=".8">Full-Stack Developer</text>
    <text x="78" y="258" fill="#C77B9B" font-size="18" letter-spacing=".7">AI Systems · Backend Engineering · Data</text>

    <g transform="translate(78 300)">
      <rect width="190" height="34" rx="17" fill="#451126" fill-opacity=".72" stroke="#C77B9B" stroke-opacity=".5"/>
      <circle cx="17" cy="17" r="4" fill="#E5B5C7">
        <animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="31" y="22" fill="#F8F0F3" font-size="12" letter-spacing="1.3">BUILD / MEASURE / REFINE</text>
    </g>

    <text x="78" y="384" fill="#E5B5C7" fill-opacity=".82" font-family="monospace" font-size="12">01 — ENGINEERING PRACTICAL, EXPLAINABLE SOFTWARE</text>
    <text x="78" y="409" fill="#E5B5C7" fill-opacity=".5" font-family="monospace" font-size="11">SYSTEMS THINKING // PRODUCT BUILDING // ITERATION</text>
  </g>

  <!-- tiny HUD labels -->
  <g font-family="monospace" font-size="9" fill="#E5B5C7" fill-opacity=".7">
    <text x="1070" y="82">SIGNAL_01</text>
    <text x="1062" y="366">NODE / ACTIVE</text>
    <text x="830" y="405">SYS.V2</text>
  </g>
  <path d="M76 444H1124" stroke="#C77B9B" stroke-opacity=".32"/>
  <path d="M76 444H350" stroke="#E5B5C7" stroke-width="2" filter="url(#lineGlow)">
    <animate attributeName="stroke-dasharray" values="0 1048;274 774;0 1048" dur="8s" repeatCount="indefinite"/>
  </path>
</g>
</svg>