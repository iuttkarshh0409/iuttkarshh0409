<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="74" viewBox="0 0 1200 74" role="img" aria-labelledby="title">
<title id="title">Animated burgundy section divider</title>
<defs>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
  <stop offset=".5" stop-color="#E5B5C7"/>
  <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
 </linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<path d="M20 37H1180" stroke="#701A3D" stroke-opacity=".45"/>
<path d="M20 37H1180" stroke="url(#line)" stroke-width="2" stroke-dasharray="140 1060">
 <animate attributeName="stroke-dashoffset" values="1200;0" dur="8s" repeatCount="indefinite"/>
</path>
<path d="M20 37H1180" stroke="#E5B5C7" stroke-opacity=".3" stroke-width="5" filter="url(#glow)" stroke-dasharray="60 1140">
 <animate attributeName="stroke-dashoffset" values="1200;0" dur="8s" repeatCount="indefinite"/>
</path>
<g fill="#E5B5C7">
 <circle cx="600" cy="37" r="4"><animate attributeName="r" values="3;6;3" dur="2.5s" repeatCount="indefinite"/></circle>
 <circle cx="280" cy="37" r="2"/><circle cx="920" cy="37" r="2"/>
</g>
</svg>