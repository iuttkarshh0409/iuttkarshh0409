<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
<title id="title">Abstract reliability signal</title><desc id="desc">Layered orbital rings and a glowing signal point in a burgundy field.</desc>
<defs>
 <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4c6d8"/><stop offset=".55" stop-color="#c77b9b"/><stop offset="1" stop-color="#701a3d"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#c77b9b" stop-opacity=".45"/><stop offset="1" stop-color="#10070c" stop-opacity="0"/></radialGradient>
 <pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#e5b5c7" stroke-opacity=".09"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="900" height="650" rx="28" fill="#10070c"/><rect width="900" height="650" rx="28" fill="url(#g)"/>
<circle cx="460" cy="320" r="280" fill="url(#glow)"/>
<g transform="translate(460 320)" fill="none">
 <circle r="215" stroke="#c77b9b" stroke-opacity=".2" stroke-dasharray="2 13"/>
 <circle r="170" stroke="#e5b5c7" stroke-opacity=".42" stroke-dasharray="80 14 3 14">
  <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="70s" repeatCount="indefinite"/>
 </circle>
 <ellipse rx="250" ry="94" transform="rotate(-32)" stroke="#c77b9b" stroke-opacity=".7"/>
 <ellipse rx="250" ry="94" transform="rotate(50)" stroke="#e5b5c7" stroke-opacity=".35" stroke-dasharray="4 10"/>
 <circle r="90" stroke="url(#orb)" stroke-opacity=".6"/>
 <path d="M-235 0H235M0-235V235" stroke="#c77b9b" stroke-opacity=".16" stroke-dasharray="3 10"/>
 <circle r="24" fill="#701a3d" stroke="#f4c6d8" stroke-width="2" filter="url(#blur)"/>
 <circle r="10" fill="#f4c6d8">
  <animate attributeName="r" values="8;14;8" dur="2.7s" repeatCount="indefinite"/>
 </circle>
 <circle cx="250" cy="0" r="6" fill="#f4c6d8">
  <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
 </circle>
</g>
<g fill="#e5b5c7" font-family="monospace" font-size="11" letter-spacing="3" opacity=".75">
 <text x="54" y="70">SIGNAL / 001</text><text x="690" y="580">RELIABILITY</text><text x="54" y="590">SYSTEMS IN MOTION</text>
</g>
</svg>